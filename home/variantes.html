<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qida — Cómo mostrar el color del área</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=10" />
<style>
  .brand{font-size:26px;font-weight:600;letter-spacing:-.02em;color:#fff}
  .page{padding:28px 0 80px}
  .var{margin:0 0 52px}
  .var-h{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
  .var-h h2{font-size:20px}
  .var-h .n{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:#fff;background:var(--brand-700);border-radius:var(--r-pill);padding:3px 10px}
  .var p.note{font-size:14px;color:var(--text-muted);margin:0 0 18px;max-width:760px}

  /* ---- base común a todas las variantes ---- */
  .v-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .v-card{position:relative;display:flex;flex-direction:column;gap:14px;background:#fff;
    border-radius:22px;padding:28px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
    transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s;overflow:hidden}
  .v-card:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(15,23,42,.06),0 18px 40px rgba(15,23,42,.12)}
  .v-area{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--neutral-700)}
  .v-card h3{font-size:22px;line-height:1.26;letter-spacing:-.015em;font-weight:600;color:var(--neutral-900)}
  .v-cta{display:inline-flex;align-items:center;gap:4px;margin:auto 0 0 auto;font-size:16px;
    font-weight:500;color:var(--brand-700)}
  .v-cta svg{width:16px;height:16px}

  /* colores de área */
  .a-fis{--cat:#FEC646;--tint:#FFFBEF;--tint2:#FDF0C9;--ink:#8A6400}
  .a-nut{--cat:#9EC938;--tint:#F3F8E7;--tint2:#E6F0CE;--ink:#4F6B12}
  .a-men{--cat:#16AA9C;--tint:#E2F5F3;--tint2:#CDEBE7;--ink:#0E6F66}

  /* 0 · línea lateral (lo que hay hoy) */
  .v0 .v-card{padding-left:34px}
  .v0 .v-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cat)}

  /* 1 · punto de color */
  .v1 .v-area{display:flex;align-items:center;gap:9px}
  .v1 .v-area::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--cat);flex:none}

  /* 2 · pastilla tintada */
  .v2 .v-area{display:inline-flex;align-self:flex-start;background:var(--tint2);color:var(--ink);
    border-radius:var(--r-pill);padding:6px 14px;letter-spacing:.07em}

  /* 3 · franja superior */
  .v3 .v-card{padding-top:34px}
  .v3 .v-card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--cat)}

  /* 4 · icono en cuadro tintado */
  .v4 .v-top{display:flex;align-items:center;gap:12px}
  .v4 .v-ico{width:44px;height:44px;border-radius:14px;background:var(--tint2);color:var(--ink);
    display:grid;place-items:center;flex:none}
  .v4 .v-ico svg{width:22px;height:22px}

  /* 5 · subrayado del antetítulo */
  .v5 .v-area{align-self:flex-start;padding-bottom:10px;border-bottom:3px solid var(--cat)}

  /* 6 · cabecera tintada */
  .v6 .v-card{padding:0}
  .v6 .v-head{background:var(--tint);padding:16px 28px}
  .v6 .v-body{padding:20px 28px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
  .v6 .v-area{color:var(--ink)}

  /* 7 · cabecera tintada con el nombre en negro */
  .v7 .v-card{padding:0}
  .v7 .v-head{background:var(--tint);padding:16px 28px}
  .v7 .v-body{padding:20px 28px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
  .v7 .v-area{color:var(--neutral-900)}

  @media (max-width:900px){ .v-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></symbol>
<symbol id="i-run" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="4.5" r="2"/><path d="M12 21l1.5-5-3-2.5.5-5 3.5 2 3 1"/><path d="M8.5 10.5L11 8.5"/><path d="M10.5 13.5L7 17"/></symbol>
<symbol id="i-fork" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v7a3 3 0 0 0 6 0V2"/><line x1="9" y1="9" x2="9" y2="22"/><path d="M17 2c-1.5 2-2 4-2 7s.5 4 2 4 2-1 2-4-.5-5-2-7z"/><line x1="17" y1="13" x2="17" y2="22"/></symbol>
<symbol id="i-brain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 1 5 3 3 0 0 0 4 4 2 2 0 0 0 3-2V5a2 2 0 0 0-3-2z"/><path d="M15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-1 5 3 3 0 0 1-4 4 2 2 0 0 1-3-2V5a2 2 0 0 1 3-2z"/></symbol>
</defs></svg>

<header class="app-header">
  <div class="container"><a href="index.html" class="brand">Qida</a>
    <div class="header-right"><a href="index.html" class="btn btn-secondary btn-sm">Volver al prototipo</a></div>
  </div>
</header>

<main><div class="container"><div class="page">
  <h1 class="pagetitle">Cómo mostrar el color del área</h1>
  <p style="color:var(--text-muted);font-size:15px;margin:-6px 0 34px;max-width:760px">
    Las mismas tres actividades con ocho formas de llevar el color. Dime el número y lo aplico.</p>
  <div id="vars"></div>
</div></div></main>

<script>
var AREAS = [
  { cls:'a-fis', label:'Actividad física', icon:'i-run',
    t:'Realiza caminatas al aire libre durante 15 minutos, manteniendo un ritmo cómodo, seguro y constante.' },
  { cls:'a-nut', label:'Nutrición', icon:'i-fork',
    t:'Realiza caminatas al aire libre durante 15 minutos, manteniendo un ritmo cómodo, seguro y constante.' },
  { cls:'a-men', label:'Mente activa', icon:'i-brain',
    t:'Realiza un sudoku desde el Portal del Cliente.', cta:'Abrir el sudoku' }
];
var VARIANTES = [
  { n:'0', t:'Línea lateral', d:'Lo que hay ahora. El color queda en el canto, discreto; a tamaño pequeño casi no se ve.' },
  { n:'1', t:'Punto de color', d:'Un punto junto al nombre del área. Lo más sobrio y lo que mejor encaja con el estilo Apple; el color acompaña al texto en vez de competir con él.' },
  { n:'2', t:'Pastilla tintada', d:'El nombre del área sobre su color, con el texto oscurecido para que contraste. Es el que se lee de más lejos.' },
  { n:'3', t:'Franja superior', d:'Barra de 8 px arriba, a todo el ancho. Se ve mucho y ordena la fila, pero rompe un poco el aire de la tarjeta.' },
  { n:'4', t:'Icono en cuadro tintado', d:'Recupera el icono dentro de un cuadro del color del área. Ayuda a reconocer la sección de un vistazo, aunque añade un elemento más.' },
  { n:'5', t:'Subrayado del antetítulo', d:'Una regla de 3 px bajo el nombre del área. Sutil y tipográfico, sin añadir formas nuevas.' },
  { n:'6', t:'Cabecera tintada', d:'Banda superior con fondo del área y el nombre en su color. Muy claro, y deja el cuerpo de la tarjeta limpio.' },
  { n:'7', t:'Cabecera tintada, nombre en negro', d:'La misma banda, con el nombre del área en Neutral/900 en vez de en el color del área. El color lo pone solo el fondo, y el texto no depende de tener un tono oscurecido por área.' }
];

function card(a, v) {
  var cta = a.cta ? '<a href="#" class="v-cta">' + a.cta + '<svg><use href="#i-chevron-right"/></svg></a>' : '';
  var area = '<span class="v-area">' + a.label + '</span>';
  if (v === '4') {
    return '<article class="v-card ' + a.cls + '">' +
      '<div class="v-top"><span class="v-ico"><svg><use href="#' + a.icon + '"/></svg></span>' + area + '</div>' +
      '<h3>' + a.t + '</h3>' + cta + '</article>';
  }
  if (v === '6' || v === '7') {
    return '<article class="v-card ' + a.cls + '">' +
      '<div class="v-head">' + area + '</div>' +
      '<div class="v-body"><h3>' + a.t + '</h3>' + cta + '</div></article>';
  }
  return '<article class="v-card ' + a.cls + '">' + area + '<h3>' + a.t + '</h3>' + cta + '</article>';
}

document.getElementById('vars').innerHTML = VARIANTES.map(function (v) {
  return '<section class="var v' + v.n + '">' +
    '<div class="var-h"><span class="n">Opción ' + v.n + '</span><h2>' + v.t + '</h2></div>' +
    '<p class="note">' + v.d + '</p>' +
    '<div class="v-grid">' + AREAS.map(function (a) { return card(a, v.n); }).join('') + '</div>' +
    '</section>';
}).join('');
</script>
</body>
</html>
