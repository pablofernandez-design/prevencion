<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portal SR · Cliente - Análisis</title>
<style>
  :root{
    --green:#004039;
    --green-dark:#002b26;
    --green-card:#013a33;
    --primary50:#E6ECEB;
    --brown:#6B3A27;
    --bg:#F6F7F9;
    --white:#fff;
    --n200:#E5E5E5;
    --n300:#D8DAE0;
    --n700:#666;
    --n900:#333;
    --success-50:#E8F8EF;
    --success-100:#B6E9CD;
    --error-100:#F8BFBF;
    --alert-50:#FDECEC;
    --alert-700:#C4362F;
    --alert-900:#5A1714;
    --success-700:#0E8343;
    --pending-bg:#FBEFC9;
    --pending-fg:#8A6B18;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Aeonik",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--n900);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  .serif{font-family:Georgia,"Times New Roman",serif}

  /* ---------- App shell ---------- */
  .app{max-width:1440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

  /* ---------- Top header ---------- */
  .topbar{
    height:64px;background:var(--white);border-bottom:1px solid var(--n200);
    display:flex;align-items:center;justify-content:space-between;padding:0 40px;
  }
  .logo{font-size:30px;color:var(--green);letter-spacing:.5px}
  .logo-svg{height:30px;width:auto;display:block;flex-shrink:0}
  .nav{display:flex;align-items:center;gap:28px;font-size:15px;color:var(--green)}
  .nav a{color:var(--green);text-decoration:none;font-weight:500}
  .nav a.active{font-weight:700}
  .nav .sep{width:1px;height:26px;background:var(--n200)}
  .user{display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .user .who{font-size:13px;line-height:1.2}
  .user .who b{display:block;font-weight:600;color:var(--n900)}
  .user .who span{color:var(--n700);font-size:12px}
  .icon{width:20px;height:20px;display:inline-block;vertical-align:middle}

  /* ---------- Page ---------- */
  .page{padding:20px 24px 48px}
  .crumbs{display:flex;align-items:center;gap:8px;color:var(--n700);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
  .crumbs .cur{color:var(--n900);font-weight:600}
  .crumbs svg{opacity:.5}

  .pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
  .pagehead h1{font-size:26px;font-weight:400;margin:0;color:var(--n900)}
  .actions{display:flex;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid var(--n300);background:var(--white);color:var(--n900);white-space:nowrap}
  .btn:hover{background:#fafafa}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn.primary:hover{background:#013128}
  .btn[disabled]{background:#EEF0F2;border-color:#EEF0F2;color:#AEB4BB;cursor:not-allowed}
  .btn.primary[disabled]{background:#EEF0F2;border-color:#EEF0F2;color:#AEB4BB}

  /* ---------- Landing layout ---------- */
  .landing{display:grid;grid-template-columns:288px 1fr;gap:16px;align-items:start}
  .side{display:flex;flex-direction:column;gap:14px}
  .navcard{
    background:#E6ECEB;color:#004039;border:2px solid #B0C4C2;border-radius:12px;padding:16px;
    min-height:128px;display:flex;flex-direction:column;gap:10px;
    text-align:left;width:100%;position:relative;cursor:pointer;transition:background .12s,border-color .12s}
  .navcard .ci,.navcard .arrow{color:#004039}
  .navcard:hover{background:#B0C4C2;border-color:#8AA7A4}
  .navcard:active{background:#8AA7A4;border-color:#336661}
  .navcard:active .arrow{color:#FFFFFF}
  .navcard .top{display:flex;align-items:flex-start;justify-content:space-between;min-height:26px}
  .navcard .ci{width:24px;height:24px}
  .navcard .ci svg{width:24px;height:24px}
  .navcard .badge{background:#B6E9CD;color:#333333;font-size:14px;font-weight:500;line-height:20px;padding:2px 8px;border-radius:4px}
  .navcard h3{margin:0;font-size:22px;font-weight:500;color:inherit}
  .navcard .arrow{align-self:flex-end;margin-top:auto}
  .navcard .arrow svg{width:24px;height:24px}
  .navcard.disabled{background:#F5F5F5;border-color:#E5E5E5;color:#666666;cursor:not-allowed;pointer-events:none}
  .navcard.disabled .ci,.navcard.disabled .arrow{color:#666666}
  .navcard.disabled .badge{background:#E5E5E5;color:#333333}

  .main{display:flex;flex-direction:column;gap:16px}
  .card{background:var(--white);border:1px solid var(--n200);border-radius:var(--radius);box-shadow:var(--shadow)}
  .resultcard{padding:20px 24px}
  .resultcard .rc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .resultcard h2{font-size:18px;font-weight:500;margin:0}
  .status{font-size:14px;font-weight:500;line-height:20px;padding:2px 8px;border-radius:4px}
  .status.pending{background:var(--pending-bg);color:var(--pending-fg)}
  .status.done{background:var(--success-100);color:var(--n900)}
  .status.pdte{background:var(--error-100);color:var(--n900)}
  .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .meta .k{font-size:11px;letter-spacing:.4px;color:var(--n700);text-transform:uppercase;margin-bottom:6px}
  .meta .v{font-size:15px;font-weight:600;color:var(--n900)}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--n200);color:var(--n900);font-size:14px;font-weight:500;line-height:20px;padding:2px 8px;border-radius:4px}
  /* Alert (componente DS) — pendiente de facturar */
  .alert{display:flex;align-items:center;gap:12px;background:var(--alert-50);border-radius:12px;padding:14px 18px;font-size:15px;color:var(--n900)}
  .alert svg{width:22px;height:22px;flex-shrink:0;color:var(--alert-700)}
  .alert.in-modal{margin:16px 0 20px}
  .rc-head-right{display:flex;align-items:center;gap:16px}
  /* labels de estado en el histórico */
  .rowtag{display:inline-flex;align-items:center;font-size:14px;font-weight:500;line-height:20px;padding:2px 8px;border-radius:4px;color:var(--n900);white-space:nowrap}
  .rowtag.fact{background:var(--success-100)}
  .rowtag.pdte{background:var(--error-100)}

  .previewcard{padding:20px 24px 24px}
  .pv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:16px}
  .pv-head h2{font-size:16px;font-weight:500;margin:0}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--n300);border-radius:8px;height:40px;padding:0 12px;width:280px;color:var(--n700);font-size:14px}
  .search input{border:none;outline:none;font:inherit;flex:1;color:var(--n900)}
  .pv-empty{background:#B8B8B8;border-radius:6px;height:360px}

  /* report cover */
  .cover{background:var(--green);color:#fff;border-radius:6px;padding:28px 32px 34px;position:relative;overflow:hidden}
  .cover .cv-top{display:flex;justify-content:space-between;font-size:12px;color:#b9cdc6;margin-bottom:26px}
  .cover h3{font-size:34px;line-height:1.1;font-weight:700;margin:0 0 18px;max-width:640px;text-transform:uppercase}
  .cover .cv-sub{font-size:24px;font-weight:600;margin-bottom:26px}
  .cover .cv-sub i{color:#8fd6ad}
  .cover .cv-pill{display:inline-flex;align-items:center;gap:12px;border:1.5px solid #4f8f74;border-radius:40px;padding:10px 22px;margin-bottom:26px}
  .cover .cv-pill b{font-size:26px;color:#8fd6ad}
  .cover .cv-pill span{font-size:13px;color:#dfeae5;max-width:320px}
  .cover .cv-line{height:2px;background:#4f8f74;margin:0 0 20px}
  .cover .cv-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .cover .cv-foot .k{font-size:11px;letter-spacing:.5px;color:#9fbbb1;text-transform:uppercase;margin-bottom:6px}
  .cover .cv-foot .v{font-size:16px;font-weight:600}

  /* ---------- Sub-screen (form) ---------- */
  .subhead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .subhead .back{width:36px;height:36px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--n900)}
  .subhead .back:hover{background:#ececec}
  .subhead h1{font-size:24px;font-weight:400;margin:0}

  /* workspace: columna lateral (primary/50) PEGADA al contenido + columna derecha opcional */
  .three{display:flex;gap:0;align-items:stretch}
  .sidecol{background:var(--primary50);border-radius:12px 0 0 12px;padding:16px;width:264px;flex:0 0 264px;display:flex;flex-direction:column;transition:flex-basis .15s,width .15s}
  .sidecol.collapsed{width:76px;flex-basis:76px}
  .sidecol .vmenu{flex:1}
  .side-toggle{align-self:flex-end;margin-top:12px;border:none;background:transparent;color:var(--green);cursor:pointer;padding:4px;display:flex}
  .sidecol.collapsed .side-toggle{align-self:center}
  .patient{background:var(--white);border:1px solid var(--n200);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .patient .pa{width:38px;height:38px;border-radius:50%;background:#eef1f0;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .patient b{display:block;font-size:15px}
  .patient span{font-size:12px;color:var(--n700)}
  .vmenu{display:flex;flex-direction:column;gap:4px}
  .vmenu button{display:flex;align-items:center;gap:12px;background:transparent;border:none;text-align:left;padding:11px 14px;border-radius:10px;font-size:15px;font-weight:500;color:var(--green);width:100%;cursor:pointer}
  .vmenu button:hover{background:#DCE6E3}
  .vmenu button.active{background:var(--green);color:#fff}
  .vmenu button.active svg{color:#fff}
  .vmenu svg{width:20px;height:20px;color:var(--green);flex-shrink:0}
  .sidecol.collapsed .vmenu button{justify-content:center;padding:11px 0}
  .sidecol.collapsed .vmenu button span{display:none}

  .panel{background:var(--white);border:1px solid var(--n200);border-left:none;border-radius:0 var(--radius) var(--radius) 0;padding:22px 24px;min-height:560px;flex:1;min-width:0}
  .rightcol{flex:0 0 300px;width:300px;margin-left:16px}
  .panel h2{font-size:20px;font-weight:500;margin:0 0 20px}
  .fieldgroup{background:#F8F9FB;border:1px solid var(--n200);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .fieldgroup label.q{display:block;font-size:14px;font-weight:500;margin-bottom:10px}
  .req{color:#c0392b}
  .selectbox{position:relative}
  .selectbox select{width:100%;height:44px;border:1px solid var(--n300);border-radius:8px;padding:0 12px;font:inherit;font-size:14px;background:#fff;appearance:none;color:var(--n900)}
  .selectbox svg{position:absolute;right:12px;top:12px;pointer-events:none;color:var(--n700)}
  .radios{display:flex;gap:28px;align-items:center}
  .radio{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
  .radio input{accent-color:var(--green);width:18px;height:18px}
  .checkrow{display:flex;align-items:center;gap:10px;font-size:14px;background:#fff;border:1px solid var(--n300);border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
  .checkrow input{accent-color:var(--green);width:16px;height:16px}
  /* análisis: subencabezado desplegable + preguntas anidadas */
  .q-sub{background:#EEF1F4;border-radius:12px;padding:16px;margin-bottom:16px}
  .q-sub-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:15px;font-weight:600;color:var(--n900)}
  .q-sub-head svg{width:20px;height:20px;color:var(--n700);transition:transform .15s}
  .q-sub-body{margin-top:12px}
  .q-sub-body .fieldgroup{background:#fff}
  .q-sub-body .fieldgroup:last-child{margin-bottom:0}
  .q-sub.collapsed .q-sub-body{display:none}
  .q-sub.collapsed .q-sub-head svg{transform:rotate(-90deg)}
  .q-input{width:100%;height:44px;border:1px solid var(--n300);border-radius:8px;padding:0 12px;font:inherit;font-size:14px;outline:none;color:var(--n900);background:#fff}
  .q-textarea{width:100%;min-height:80px;border:1px solid var(--n300);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;outline:none;resize:vertical;color:var(--n900);background:#fff}
  .tagsbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--n300);border-radius:8px;padding:10px 12px;min-height:44px}
  .tagsbox > svg{margin-left:auto;width:20px;height:20px;color:var(--n700)}
  .tagchip{display:inline-flex;align-items:center;gap:6px;background:#EDF1EF;border:1px solid var(--n200);border-radius:6px;padding:3px 9px;font-size:13px;color:var(--green)}
  .tagchip b{color:var(--n700);font-weight:400}
  /* header histórico: próximo informe + botón disabled (estilo DS) */
  .list-head-right{display:flex;align-items:center;gap:16px}
  .prox{display:flex;align-items:center;gap:10px}
  .prox-lbl{font-size:14px;color:var(--n700)}
  .prox-pill{background:#E3EEE8;color:var(--green);font-size:14px;font-weight:600;padding:6px 14px;border-radius:8px;white-space:nowrap}
  .btn.primary.disabled,.btn.primary:disabled,.btn.primary[disabled]{background:#E7E9EC;color:#9BA1A7;border-color:#E7E9EC;opacity:1;cursor:not-allowed;pointer-events:none}
  .btn.primary[disabled] svg{color:#9BA1A7}
  /* selector de escenario: FAB flotante (demo) abajo a la derecha, oculta/expande */
  .scen-fab{position:fixed;right:16px;bottom:16px;z-index:70}
  .scen-fab-btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:none;border-radius:24px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.2)}
  .scen-fab-btn svg{width:18px;height:18px;color:#fff}
  .scen-panel{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--n200);border-radius:12px;padding:10px 12px 10px 16px;box-shadow:0 12px 34px rgba(0,0,0,.18);flex-wrap:wrap;max-width:calc(100vw - 32px)}
  .scen-lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--green)}
  .scen-opts{display:flex;gap:6px}
  .scen{width:30px;height:30px;border-radius:8px;border:1px solid var(--n300);background:#fff;color:var(--n700);font-size:13px;font-weight:600;cursor:pointer}
  .scen:hover{border-color:var(--green)}
  .scen.on{background:var(--green);color:#fff;border-color:var(--green)}
  .scen-desc{font-size:13px;color:var(--n900);font-weight:500;max-width:260px}
  .scen-x{background:none;border:none;cursor:pointer;color:var(--n700);display:flex;padding:4px;border-radius:6px}
  .scen-x:hover{background:var(--n100,#f0f0f0)}
  .scen-x svg{width:20px;height:20px}

  .notespanel{background:var(--white);border:1px solid var(--n200);border-radius:var(--radius);padding:18px 20px}
  .notespanel h4{font-size:15px;font-weight:500;margin:0 0 12px}
  .notespanel textarea{width:100%;min-height:480px;border:1px solid var(--n200);border-radius:8px;padding:12px;font:inherit;font-size:14px;resize:vertical;outline:none;color:var(--n900)}

  .subfoot{display:flex;justify-content:flex-end;margin-top:18px}

  /* empty section state */
  .empty-sec{background:#F8F9FB;border:1px dashed var(--n300);border-radius:10px;padding:28px;text-align:center;color:var(--n700);font-size:14px}

  /* resumen specifics */
  .valoracion{display:flex;gap:8px;flex-wrap:wrap}
  .val{width:40px;height:40px;border-radius:8px;border:1px solid var(--green);background:#fff;font-size:20px;font-weight:500;color:var(--green);cursor:pointer;transition:transform .05s}
  .val:hover{transform:translateY(-1px)}
  .val.sel{color:#fff;border-color:transparent}
  .val.low.sel{background:#C4362F}
  .val.mid.sel{background:#D98E04}
  .val.high.sel{background:#0E8343}
  .subcard{background:#F8F9FB;border:1px solid var(--n200);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .subcard h4{font-size:15px;font-weight:500;margin:0 0 12px}
  .res-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .res-status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--n700)}
  .res-status svg{color:#0E8343;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .res-ia{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#0E8343;font-weight:500}
  .res-undo{border:none;background:transparent;color:var(--n700);cursor:pointer;padding:2px;vertical-align:middle}
  .res-undo:hover{color:var(--n900)}
  .resumen-text{background:#fff;border:1px solid var(--n200);border-radius:8px;padding:14px;font-size:14px;line-height:1.55;color:#444;min-height:96px;white-space:pre-line}
  .adjust{margin-top:12px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--n300);border-radius:8px;padding:6px 6px 6px 14px}
  .adjust input{flex:1;border:none;outline:none;font:inherit;font-size:14px;background:transparent}
  .adjust .send{width:34px;height:34px;border-radius:7px;border:none;background:#EEF0F2;color:#AEB4BB;display:flex;align-items:center;justify-content:center;transition:.12s}
  .adjust .send.active{background:var(--green);color:#fff;cursor:pointer}
  /* objetivos: valoración por área + selección de objetivos/perfiles */
  .objws{display:flex;gap:16px;align-items:flex-start}
  .areacol{background:var(--primary50);border-radius:12px;padding:16px;width:272px;flex:0 0 272px;display:flex;flex-direction:column;gap:12px}
  .areacard{background:#fff;border:2px solid;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .areacard.at{border-color:#A52222}
  .areacard.mej{border-color:#AD941A}
  .areacard.sig{border-color:#0E8343}
  .ac-head{display:flex;align-items:center;gap:10px}
  .ac-ic{display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ac-ic svg{width:22px;height:22px;color:var(--n900)}
  .ac-name{font-size:15px;color:var(--n900);font-weight:500}
  .ac-foot{display:flex;align-items:center;justify-content:space-between}
  .ac-score{font-size:16px;font-weight:700}
  .areacard.at .ac-score{color:#A52222}
  .areacard.mej .ac-score{color:#AD941A}
  .areacard.sig .ac-score{color:#0E8343}
  .ac-badge{font-size:13px;font-weight:600;padding:3px 11px;border-radius:16px;color:#fff}
  .areacard.at .ac-badge{background:#A52222}
  .areacard.mej .ac-badge{background:#AD941A}
  .areacard.sig .ac-badge{background:#0E8343}
  .objright{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
  .objcard{background:#fff;border:1px solid var(--n200);border-radius:12px;padding:24px}
  .objtitle{font-size:18px;font-weight:500;margin:0 0 18px}
  .objgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .objcol{display:flex;flex-direction:column;background:#F6F7F9;border-radius:12px;padding:18px}
  .objcol .q{display:block;font-size:14px;font-weight:600;color:var(--n900);margin-bottom:8px}
  .objcol .selectbox select{background:#fff}
  /* nuevo: un bloque por objetivo (área + perfil + actividades inline) */
  .objblock{background:#F6F7F9;border-radius:12px;padding:18px;margin-bottom:16px}
  .objblock:last-child{margin-bottom:0}
  .objselrow{display:flex;gap:16px;flex-wrap:wrap}
  .objblock .act-tabs{margin-top:16px}
  .objfield{flex:0 0 328px;max-width:340px;min-width:240px}
  .objfield .q{display:block;font-size:14px;font-weight:600;color:var(--n900);margin-bottom:8px}
  .objblock .selectbox select{background:#fff}
  .objcard-foot{display:flex;justify-content:flex-end;margin-top:20px}
  .act-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 20px}
  .act-emptyic{width:56px;height:56px;border-radius:50%;background:var(--primary50);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
  .act-emptyic svg{width:26px;height:26px;color:var(--n700)}
  .act-empty b{font-size:16px;font-weight:500;color:var(--n900)}
  .act-empty p{margin:0;font-size:14px;color:var(--n700);max-width:460px;line-height:1.5}
  /* alerta warning: definición de objetivos cambiada */
  .alert-warn{display:flex;gap:12px;align-items:center;background:#FBF6E0;border-radius:8px;padding:14px 16px;margin-bottom:20px}
  .alert-warn .aw-ic{flex-shrink:0;display:flex}
  .alert-warn .aw-ic svg{width:20px;height:20px;color:#AD941A}
  .alert-warn p{margin:0;font-size:14px;color:var(--n900);line-height:1.45}
  /* actividades con contenido: pestañas + parrilla semanal */
  .act-tabs{display:flex;border-bottom:1px solid var(--n200);margin-bottom:20px}
  .act-tab{flex:1;background:none;border:none;padding:12px 8px;font-size:15px;color:var(--n700);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.1s}
  .act-tab:hover{color:var(--n900)}
  .act-tab.on{color:var(--green);font-weight:500;border-bottom-color:var(--green)}
  .act-month{margin-bottom:24px}
  .act-mlabel{font-size:12px;letter-spacing:.5px;color:var(--n700);text-transform:uppercase;margin-bottom:12px;font-weight:500}
  .act-grid{border:1px solid var(--n200);border-radius:8px;overflow:hidden}
  .act-grow{display:grid;grid-template-columns:repeat(7,1fr)}
  .act-hcell{background:#EDF1EF;text-align:center;padding:9px 8px;font-size:14px;color:var(--n900);border-right:1px solid var(--n200)}
  .act-hcell:last-child{border-right:none}
  .act-cell{padding:10px;font-size:12.5px;color:var(--n900);border-right:1px solid var(--n200);border-top:1px solid var(--n200);display:flex;flex-direction:column;gap:8px;line-height:1.4}
  .act-grow:last-child .act-cell:last-child{border-right:none}
  .act-cell p{margin:0}
  .btn.act-acceder{height:32px;font-size:14px;padding:0 12px;justify-content:center;margin-top:auto}
  .collap h4{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .notes-body{font-size:13.5px;line-height:1.6;color:#555;white-space:pre-line;margin-top:6px}
  .metrics{background:#fff;border:1px solid var(--n200);border-radius:var(--radius);overflow:hidden}
  .metrics .row{display:flex;justify-content:space-between;padding:11px 16px;font-size:14px;border-top:1px solid #F0F0F0}
  .metrics .row:first-child{border-top:none}
  .metrics .row .k{color:var(--n900)}
  .metrics .row .v{color:var(--n900);font-weight:500}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,64,57,.4);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:520px;max-width:92vw;padding:24px 26px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .modal .mh{display:flex;justify-content:space-between;align-items:flex-start}
  .modal h3{font-size:20px;font-weight:600;margin:0}
  .modal .x{border:none;background:transparent;color:var(--n700);width:28px;height:28px}
  .modal p{color:var(--n700);font-size:14px;margin:8px 0 20px;line-height:1.5}
  .modal .lbl{font-size:11px;letter-spacing:.4px;color:var(--n700);text-transform:uppercase;margin-bottom:12px}
  .opt{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px;cursor:pointer}
  .opt input{accent-color:var(--green);width:18px;height:18px}
  .modal .mfoot{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}
  /* vista previa del informe */
  .preview-modal{background:#fff;border-radius:14px;width:760px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .pm-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--n200);position:sticky;top:0;background:#fff}
  .pm-head b{display:block;font-size:17px;font-weight:600}
  .pm-head span{font-size:13px;color:var(--n700)}
  .pm-head .x{border:none;background:transparent;color:var(--n700);width:28px;height:28px;cursor:pointer}
  .pm-body{padding:24px}

  /* ---------- Prototype launcher ---------- */
  .menu{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px;background:var(--bg)}
  .menu .logo{font-size:46px}
  .menu p{color:var(--n700);margin:0}
  .menu .flows{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:820px}
  .flowbtn{background:var(--white);border:1px solid var(--n200);border-radius:16px;padding:26px 24px;width:240px;text-align:left;box-shadow:var(--shadow);transition:transform .1s}
  .flowbtn:hover{transform:translateY(-3px);border-color:var(--green)}
  .flowbtn .fi{width:42px;height:42px;border-radius:10px;background:var(--success-50);color:var(--green);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .flowbtn b{display:block;font-size:18px;margin-bottom:6px}
  .flowbtn span{font-size:13px;color:var(--n700);line-height:1.4}

  /* ---------- Histórico list (Cliente - Análisis) ---------- */
  .listcard{padding:0;overflow:hidden}
  .list-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px}
  .list-head h2{font-size:18px;font-weight:500;margin:0}
  .tbl{width:100%;border-collapse:collapse}
  .tbl thead th{font-size:11px;letter-spacing:.4px;color:var(--n700);text-transform:uppercase;font-weight:500;text-align:left;padding:8px 24px}
  .tbl tbody tr{border-top:1px solid var(--n200);cursor:pointer}
  .tbl tbody tr:hover{background:#fafbfc}
  .tbl td{padding:16px 24px;font-size:14px;color:var(--n900);vertical-align:middle}
  .tbl td.date{color:var(--n900)}
  .tbl .pdf{color:var(--green);text-decoration:underline}
  .tbl td.chev{text-align:right;color:var(--n700);width:56px}
  .tbl td.chev svg{width:18px;height:18px}

  /* prototype home fab */
  .fab{position:fixed;left:16px;bottom:16px;z-index:60;background:var(--green);color:#fff;border:none;border-radius:24px;height:40px;padding:0 16px;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .fab.show{display:inline-flex}

  .hidden{display:none !important}
</style>

/* ---------- Fechas: DD/MM/YYYY HH:MM (hora real) ---------- */
function fmtDate(d){ if(!d) return '-'; const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function parseDMY(s,time){ const [dd,mm,yy]=s.split('/').map(Number); const [h,m]=(time||'11:05').split(':').map(Number); return new Date(yy,mm-1,dd,h,m); }

/* ---------- Navigation ---------- */
const el = (id)=>document.getElementById(id);
function useHeaderPortal(){ /* única cabecera del portal */ }
// Flecha atrás de las secciones: way out a la página del informe (sale del flujo lineal)
function goInforme(){ state.wizard=false; renderLanding(); }
function goList(){ el('fab').classList.remove('show'); renderList(); }
// Nuevo informe: arranca un informe inicial y va DIRECTO al Análisis inicial
function startNuevo(){ startNuevoTipo('inicial'); }
function startNuevoTipo(key){
  const now=new Date(); state=fresh(); const info=TIPO_INFO[key];
  state.type=info.type; state.title=TIPO_BASE[key]; state.tCreacion=now; el('fab').classList.add('show');
  if(info.analisis==='inicial') openAnalisis();
  else if(info.analisis==='anual') openSeguimiento();
  else openAnalisisTBD(info.label);
}
function noop(){}
function openAnalisisTBD(titulo){ useHeaderPortal();
  el('view').innerHTML=`
  <div class="page">
    <div class="subhead"><button class="back" onclick="goInforme()">${I.back}</button><h1>Análisis</h1></div>
    <div class="three">
      ${sidecolHTML(SECCIONES,SECCIONES[0],SEC_ICON,'noop',{patient:true,toggle:false})}
      <div class="panel"><div class="act-empty" style="padding:64px 20px"><div class="act-emptyic">${I.report}</div><b>Análisis pendiente de definir</b><p>Las lógicas de análisis del ${titulo.toLowerCase()} son diferentes a las del informe inicial y anual, y se definirán más adelante.</p></div></div>
      ${rightNotes()}
    </div>
    <div class="subfoot"><button class="btn primary" onclick="saveAnalisis()">${state.wizard?'Guardar y continuar':'Guardar y volver atrás'}</button></div>
  </div>`;
  window.scrollTo(0,0);
}
// Informe inicial ya generado (visto desde el histórico) — notas y fechas del histórico
// Informe abierto desde el histórico: el estado depende de la label de la fila
// (fact = facturado; pdte = pendiente de facturar → sin fecha/método, con alerta)
function openReport(type,name,row){
  const t=row?parseDMY(row.fecha):new Date();
  const fact = !row || row.estado==='fact';
  state={type, title:name||(type==='seguimiento'?'Informe de seguimiento':'Informe inicial'),
    done:{analisis:true,resumen:true,objetivos:true}, generated:fact,
    metodo: fact?'ambos':null, notas:DATA.notas,
    tCreacion:t, tActualizacion:t, tGeneracion: fact?t:null, wizard:false};
  el('fab').classList.add('show'); renderLanding();
}
function startInicial(name,row){ openReport('inicial',name,row); }
function startSeguimiento(name,row){ openReport('seguimiento',name,row); }

/* ---------- Histórico de análisis list (Cliente - Análisis) ---------- */
// Ciclo de vida del informe: inicial → seguimiento 1 (+4m) → seguimiento 2 (+4m) → anual (+4m) → seguimiento 1 del año siguiente…
// El análisis del inicial y del anual usan las lógicas ya montadas; seguimiento 1 y 2 tienen lógicas propias (pendientes).
const TIPO_INFO={
  inicial:{label:'Informe inicial', type:'inicial', analisis:'inicial'},
  seg1:{label:'Informe de seguimiento 1', type:'seguimiento', analisis:'seg'},
  seg2:{label:'Informe de seguimiento 2', type:'seguimiento', analisis:'seg'},
  anual:{label:'Informe anual', type:'seguimiento', analisis:'anual'},
};
const SCENARIOS=[
 {t:'Vacío · siguiente = informe inicial', reports:[], next:{key:'inicial',available:true}},
 {t:'Inicial creado · seguimiento 1 en 4 meses (bloqueado)', reports:[['inicial','15/01/2025']], next:{key:'seg1',available:false,fecha:'15/05/2025'}},
 {t:'Inicial creado · se puede hacer seguimiento 1', reports:[['inicial','15/01/2025']], next:{key:'seg1',available:true}},
 {t:'Inicial + Seg. 1 · seguimiento 2 en 4 meses (bloqueado)', reports:[['inicial','15/01/2025'],['seg1','15/05/2025']], next:{key:'seg2',available:false,fecha:'15/09/2025'}},
 {t:'Inicial + Seg. 1 · se puede hacer seguimiento 2', reports:[['inicial','15/01/2025'],['seg1','15/05/2025']], next:{key:'seg2',available:true}},
 {t:'Inicial + Seg. 1 + Seg. 2 · informe anual en 4 meses (bloqueado)', reports:[['inicial','15/01/2025'],['seg1','15/05/2025'],['seg2','15/09/2025']], next:{key:'anual',available:false,fecha:'15/01/2026'}},
 {t:'Inicial + Seg. 1 + Seg. 2 · se puede hacer informe anual', reports:[['inicial','15/01/2025'],['seg1','15/05/2025'],['seg2','15/09/2025']], next:{key:'anual',available:true}},
 {t:'Año 1 completo · seguimiento 1 del año siguiente en 4 meses (bloqueado)', reports:[['inicial','15/01/2025'],['seg1','15/05/2025'],['seg2','15/09/2025'],['anual','15/01/2026']], next:{key:'seg1',available:false,fecha:'15/05/2026'}},
];
let scenario=0, CURRENT_ROWS=[], scenCollapsed=true;
function setScenario(i){ scenario=i; renderList(); }
function toggleScen(){ scenCollapsed=!scenCollapsed; renderList(); }
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES_ABR=['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
function mesAno(dmy){ const [d,m,y]=dmy.split('/').map(Number); return MESES[m-1]+' '+y; }
function mesAnoAbr(dmy){ const [d,m,y]=dmy.split('/').map(Number); return MES_ABR[m-1]+' '+y; }
const TIPO_BASE={inicial:'Plan de Prevención', anual:'Plan de Prevención', seg1:'1º seguimiento', seg2:'2º seguimiento'};
function labelFor(key,fecha){ return TIPO_BASE[key]+' - '+mesAnoAbr(fecha); }
const ESTADO_LABEL={fact:'Facturado', pdte:'Pendiente de facturar'};
function openRow(i){ const r=CURRENT_ROWS[i]; r.type==='seguimiento' ? startSeguimiento(r.informe,r) : startInicial(r.informe,r); }
function renderList(){
  const sc=SCENARIOS[scenario];
  CURRENT_ROWS = sc.reports.slice().reverse().map(([key,fecha])=>({fecha, informe:labelFor(key,fecha), metodo:'Correo electrónico y postal', type:TIPO_INFO[key].type, estado:'fact', key}));
  const nx=sc.next, ni=nx&&nx.key?TIPO_INFO[nx.key]:null;
  let headRight='';
  if(ni){
    if(nx.available){ headRight=`<button class="btn primary" onclick="startNuevoTipo('${nx.key}')">${I.plus} Nuevo informe</button>`; }
    else { headRight=`<div class="prox"><span class="prox-lbl">Próximo informe:</span><span class="prox-pill">${mesAno(nx.fecha)}</span></div><button class="btn primary disabled" disabled>${I.plus} Nuevo informe</button>`; }
  }
  const body = CURRENT_ROWS.length ? `<table class="tbl">
        <thead><tr><th>Fecha</th><th>Informe</th><th>Método de envío</th><th>Informe</th><th>Estado</th><th></th></tr></thead>
        <tbody>${CURRENT_ROWS.map((r,i)=>`<tr onclick="openRow(${i})"><td class="date">${r.fecha}</td><td>${r.informe}</td><td>${r.metodo}</td><td><a class="pdf" onclick="event.stopPropagation();previewInforme(${i})">informe.pdf</a></td><td><span class="rowtag ${r.estado}">${ESTADO_LABEL[r.estado]}</span></td><td class="chev">${I.chev}</td></tr>`).join('')}</tbody>
      </table>` : `<div class="act-empty" style="padding:48px 20px"><div class="act-emptyic">${I.report}</div><b>Aún no hay informes</b><p>Crea el primer informe (inicial) para empezar el seguimiento del cliente.</p></div>`;
  const scenSel=`<div class="scen-fab">${scenCollapsed
    ? `<button class="scen-fab-btn" onclick="toggleScen()" title="Escenarios demo">${I.dots}<span>Escenario ${scenario+1}</span></button>`
    : `<div class="scen-panel"><span class="scen-lbl">Escenario</span><div class="scen-opts">${SCENARIOS.map((s,i)=>`<button class="scen ${i===scenario?'on':''}" title="${s.t}" onclick="setScenario(${i})">${i+1}</button>`).join('')}</div><span class="scen-desc">${sc.t}</span><button class="scen-x" onclick="toggleScen()" title="Ocultar">${I.chevdown}</button></div>`
  }</div>`;
  el('view').innerHTML=`
  <div class="page">
    <div class="crumbs"><span>Clientes</span> ${I.chev} <span>Pablo Fernández</span> ${I.chev} <span class="cur">Histórico de análisis</span></div>
    <div class="pagehead"><h1>Histórico de análisis</h1></div>
    <div class="card listcard">
      <div class="list-head"><h2>Histórico de análisis</h2><div class="list-head-right">${headRight}</div></div>
      ${body}
    </div>
  </div>${scenSel}`;
  window.scrollTo(0,0);
}

// Alerta "pendiente de facturar" (estilo componente Alert del DS)
function alertHTML(inModal){
  return `<div class="alert${inModal?' in-modal':''}">${I.alertCircle}<span>Este informe está listo para facturar.</span></div>`;
}

/* Tarjeta de acción (PdP - Análisis - Cards secciones): Normal / Completado / Disable */
function navCardHTML(key, icon, label, onclick, enabled, s){
  const done = s.done[key];
  const cls = 'navcard' + (done?' done':'') + (enabled?'':' disabled');
  const tag = done ? '<span class="badge">Completado</span>' : '';
  const attr = enabled ? `onclick="${onclick}"` : 'disabled';
  return `<button class="${cls}" ${attr}><div class="top"><span class="ci">${icon}</span>${tag}</div><h3>${label}</h3><span class="arrow">${I.arrow}</span></button>`;
}

/* ---------- Landing render (screens 1,2,3,4,6,7) ---------- */
function renderLanding(){
  const s=state;
  const allDone = s.done.analisis && s.done.resumen && s.done.objetivos;
  const facturado = s.generated; // "facturado" = informe facturado
  const showCover = allDone || facturado;
  const dateCreate=fmtDate(s.tCreacion);
  const dateUpd = fmtDate(s.tActualizacion);
  let metodoCell='-';
  if(facturado){
    const label = s.metodo==='ambos' ? 'Correo electrónico y postal' : 'Correo electrónico';
    metodoCell = `<span class="chip">${I.mail} ${label}</span>`;
  }
  const badge = (k)=> s.done[k] ? '<span class="badge">Completado</span>' : '';

  // Estado del resultado + botón facturar. La alerta solo aplica a "pendiente de facturar".
  const pendienteFacturar = allDone && !facturado;
  let statusTag, facturarBtn='';
  if(facturado){
    statusTag='<span class="status done">Facturado</span>';
  } else if(allDone){
    statusTag='<span class="status pdte">Pendiente de facturar</span>';
    facturarBtn=`<button class="btn primary" onclick="openModal()">${I.file} Facturar informe</button>`;
  } else {
    statusTag='<span class="status pending">Pendiente</span>';
  }
  // Fecha de facturación: fecha real si facturado; "Pendiente de facturar" si listo; "-" si en progreso
  const dateFact = facturado ? fmtDate(s.tGeneracion) : (pendienteFacturar ? 'Pendiente de facturar' : '-');

  const preview = showCover ? coverHTML() : '<div class="pv-empty"></div>';

  el('view').innerHTML = `
  <div class="page">
    <div class="crumbs">
      <span>Clientes</span> ${I.chev}
      <span>Pablo Fernández</span> ${I.chev}
      <a href="#" onclick="confirmSalir();return false" style="color:inherit;text-decoration:none">Histórico de análisis</a> ${I.chev}
      <span class="cur">${s.title}</span>
    </div>
    <div class="pagehead">
      <h1>${s.title}</h1>
    </div>

    <div class="landing">
      <div class="side">
        ${navCardHTML('analisis', I.chart, 'Análisis', (s.type==='seguimiento'?'openSeguimiento()':'openAnalisis()'), true, s)}
        ${navCardHTML('resumen', I.doc, 'Resumen Ejecutivo', 'openResumen()', s.done.analisis, s)}
        ${navCardHTML('objetivos', I.target, 'Objetivos', 'openObjetivos()', s.done.resumen, s)}
      </div>

      <div class="main">
        ${pendienteFacturar ? alertHTML() : ''}
        <div class="card resultcard">
          <div class="rc-head">
            <h2>Resultado</h2>
            <div class="rc-head-right">${statusTag}${facturarBtn}</div>
          </div>
          <div class="meta">
            <div><div class="k">Fecha de creación</div><div class="v">${dateCreate}</div></div>
            <div><div class="k">Última actualización</div><div class="v">${dateUpd}</div></div>
            <div><div class="k">Fecha de facturación</div><div class="v">${dateFact}</div></div>
            <div><div class="k">Método de envío</div><div class="v">${metodoCell}</div></div>
          </div>
        </div>

        <div class="card previewcard">
          <div class="pv-head">
            <h2>Vista previa del Informe</h2>
            <div class="search">${I.search}<input placeholder="Buscar" /></div>
          </div>
          ${preview}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- Helpers compartidos ---------- */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let sideCollapsed=false;
// Columna lateral (fondo primary/50, pegada al contenido). toggle = colapsar/expandir (resumen/objetivos)
function sidecolHTML(items, active, iconMap, fn, opts){
  opts=opts||{};
  const coll = opts.toggle && sideCollapsed;
  const patient = opts.patient && !coll
    ? `<div class="patient"><div class="pa">PF</div><div><b>Pablo Fernández</b><span>Póliza #VRMC018619GB19</span></div></div>` : '';
  const menu = items.map(m=>`<button class="${m===active?'active':''}" onclick="${fn}('${m.replace(/'/g,"\\'")}')">${I[iconMap[m]]}<span>${m}</span></button>`).join('');
  const toggle = opts.toggle
    ? `<button class="side-toggle" onclick="sideCollapsed=!sideCollapsed;${fn}('${active.replace(/'/g,"\\'")}')" title="Colapsar / expandir">${I.collapse}</button>` : '';
  return `<aside class="sidecol ${coll?'collapsed':''}">${patient}<div class="vmenu">${menu}</div>${toggle}</aside>`;
}
function rightNotes(){
  return `<aside class="rightcol"><div class="notespanel">
      <h4>Notas globales de la llamada</h4>
      <textarea placeholder="Escribe aquí..." oninput="state.notas=this.value">${esc(state.notas)}</textarea>
    </div></aside>`;
}

}

let _qid=0;
function renderField(f){
  let ctrl='';
  if(f.t==='yesno'){ const n='r'+(_qid++); ctrl=`<div class="radios"><label class="radio"><input type="radio" name="${n}"> Sí</label><label class="radio"><input type="radio" name="${n}"> No</label></div>`; }
  else if(f.t==='sel'||f.t==='multi'){ ctrl=`<div class="selectbox"><select><option value="" disabled selected>Selecciona…</option>${(f.o||[]).map(o=>`<option>${o}</option>`).join('')}</select>${I.chevdown}</div>`; }
  else if(f.t==='tags'){ ctrl=`<div class="tagsbox">${(f.o||[]).map(o=>`<span class="tagchip">${o} <b>✕</b></span>`).join('')}${I.chevdown}</div>`; }
  else if(f.t==='check'){ ctrl=(f.o||[]).map(o=>`<label class="checkrow"><input type="checkbox"> ${o}</label>`).join(''); }
  else if(f.t==='text'){ ctrl=`<input class="q-input" placeholder="Escribe aquí…">`; }
  else if(f.t==='textarea'){ ctrl=`<textarea class="q-textarea" placeholder="Escribe aquí…"></textarea>`; }
  return `<div class="fieldgroup"><label class="q">${f.l} <span class="req">*</span></label>${ctrl}</div>`;
}
function renderFields(fields){
  let html=''; let g=null;
  const flush=()=>{ if(g){ html+=`<div class="q-sub"><div class="q-sub-head" onclick="this.parentNode.classList.toggle('collapsed')"><span>${g.l}</span>${I.chevdown}</div><div class="q-sub-body">${g.items.join('')}</div></div>`; g=null; } };
  for(const f of fields){ if(f.t==='sub'){ flush(); g={l:f.l,items:[]}; } else { const h=renderField(f); if(g) g.items.push(h); else html+=h; } }
  flush(); return html;
}
function analisisContent(sec, anual){
  let fields=(ANALISIS_DATA[sec]||[]).slice();
  if(anual && sec==='Cognitiva') fields=fields.concat(COGNITIVA_ANUAL);
  return `<h2>${sec}</h2>${renderFields(fields)}`;
}

}

    </div>
    <div class="subfoot">
      <button class="btn primary" onclick="saveAnalisis()">${state.wizard?'Guardar y continuar':'Guardar y volver atrás'}</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- Resumen Ejecutivo / Objetivos ---------- */
const RES_MENU=['Nutricional','Cognitivo','Actividad Física','Emocional','Social','Auditivo y ocular','Tabaco y alcohol'];
const RES_ICON={'Nutricional':'m_nutr','Cognitivo':'m_cogn','Actividad Física':'m_act','Emocional':'m_emo','Social':'m_soc','Auditivo y ocular':'m_aud','Tabaco y alcohol':'m_tab'};
function bandOf(n){ return n<=4?'low':(n<=7?'mid':'high'); }
function notesCollap(){
  const body = state.notas ? esc(state.notas) : '<span style="color:#9aa">Sin notas todavía.</span>';
  return `<div class="subcard collap">
          <h4 onclick="this.nextElementSibling.classList.toggle('hidden')">Notas globales de la llamada ${I.chevdown}</h4>
          <div class="notes-body">${body}</div>
        </div>`;
}

/* ---------- Screen 2.1 : Resumen Ejecutivo (editor) ---------- */
// resumenUI: estado del componente de texto  1=normal 2=escribiendo 3=procesando 4=editado IA
let resumenUI = { status:1, text:DATA.resumenText, rating:8 };
function openResumen(active){
  active=active||'Nutricional'; useHeaderPortal();
  resumenUI={status:1, text:DATA.resumenText, rating:resumenUI.rating||8};
  el('view').innerHTML=`
  <div class="page">
    <div class="subhead">
      <button class="back" onclick="goInforme()">${I.back}</button>
      <h1>Resumen Ejecutivo</h1>
    </div>
    <div class="three">
      ${sidecolHTML(RES_MENU,active,RES_ICON,'openResumen',{toggle:true})}
      <div class="panel">
        <h2>${active}</h2>
        <div class="subcard">
          <h4>Valoración</h4>
          <div class="valoracion">${Array.from({length:11},(_,i)=>`<button class="val ${bandOf(i)} ${i===resumenUI.rating?'sel':''}" onclick="setRating(${i})">${i}</button>`).join('')}</div>
        </div>
        <div class="subcard" id="resumenCard">
          <div class="res-head"><h4 style="margin:0">Resumen Ejecutivo</h4><span id="resHeadRight"></span></div>
          <div class="resumen-text" id="resumenText">${DATA.resumenText}</div>
          <div class="adjust"><input id="adjustInput" placeholder="Ajustar resumen..." oninput="onAdjustInput()"><button class="send" id="sendBtn" onclick="sendAdjust()">${I.sendup}</button></div>
        </div>
        ${notesCollap()}
      </div>
      ${rightKpi()}
    </div>
    <div class="subfoot">
      <button class="btn primary" onclick="saveResumen()">${state.wizard?'Guardar y continuar':'Guardar'}</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}
function setRating(n){
  resumenUI.rating=n;
  document.querySelectorAll('.valoracion .val').forEach((b,i)=>{ b.classList.toggle('sel', i===n); });
}
// status 2: al teclear en "Ajustar resumen" se activa el botón de enviar
function onAdjustInput(){
  const inp=el('adjustInput'); const btn=el('sendBtn');
  const has=inp.value.trim().length>0;
  btn.classList.toggle('active', has);
  resumenUI.status = has?2:1;
}
// status 3 (procesando) -> status 4 (editado con IA)
function sendAdjust(){
  const inp=el('adjustInput'); if(!inp.value.trim()) return;
  inp.value=''; inp.disabled=true;
  el('sendBtn').classList.remove('active');
  resumenUI.status=3;
  el('resumenText').textContent='';
  el('resHeadRight').innerHTML=`<span class="res-status">${I.sparkle} Adaptando el resumen...</span>`;
  setTimeout(()=>{
    resumenUI.status=4; resumenUI.text=DATA.resumenTextIA;
    el('resumenText').textContent=DATA.resumenTextIA;
    el('resHeadRight').innerHTML=`<span class="res-ia">${I.sparkle} Editado con IA</span> <button class="res-undo" onclick="undoResumen()" title="Deshacer">${I.undo}</button>`;
    el('adjustInput').disabled=false;
  }, 2600);
}
function undoResumen(){
  resumenUI.status=1; resumenUI.text=DATA.resumenText;
  el('resumenText').textContent=DATA.resumenText;
  el('resHeadRight').innerHTML='';
  const inp=el('adjustInput'); inp.value=''; inp.disabled=false;
  el('sendBtn').classList.remove('active');
}
function saveResumen(){ state.done.resumen=true; state.tActualizacion=new Date(); state.wizard ? openObjetivos() : renderLanding(); }

/* ---------- Objetivos (valoración por área + selección de objetivos/perfiles) ---------- */
// Valoración por área (viene del backend por los resultados de las secciones)
const AREAS=[
  {a:'Actividad Física', s:3, lvl:'at', ic:'m_func'},
  {a:'Nutrición', s:6, lvl:'mej', ic:'m_nutr'},
  {a:'Mente activa', s:9, lvl:'sig', ic:'m_cogn'},
  {a:'Bienestar emocional', s:8, lvl:'sig', ic:'m_emo'},
  {a:'Sueño', s:6, lvl:'mej', ic:'m_sleep'},
  {a:'Social', s:9, lvl:'sig', ic:'m_soc'},
  {a:'Auditivo y ocular', s:9, lvl:'sig', ic:'m_aud'},
  {a:'Tabaco y alcohol', s:10, lvl:'sig', ic:'m_tab'},
];
const LVL_LABEL={at:'ATENCIÓN', mej:'MEJORA', sig:'SIGUE ASÍ'};
// Perfiles por área (del CMS). Solo algunas áreas tienen perfil; el resto no.
const PERFIL_MAP={
  'Actividad Física':['General','Diversidad funcional','Contraindicaciones médicas – tronco inferior','Contraindicaciones médicas – tronco superior','Tonificación baja','Tonificación media'],
  'Nutrición':['General','Vegetariano'],
};
function hasPerfil(area){ return !!PERFIL_MAP[area]; }
function perfilOpts(area){ return PERFIL_MAP[area] || []; }
// Actividades (una vez asignadas): parrilla semanal por meses, con "Acceder" en algunas
const DIAS_SEM=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const ACT_WEEK=[
  {t:'Realiza caminatas al aire libre durante 15 minutos, manteniendo un ritmo cómodo, seguro y constante.'},
  {t:'Realiza 1 serie de 10 repeticiones del ejercicio 3 adjuntado en el cuadernillo.'},
  {t:'Realiza 1 serie de 8 repeticiones del ejercicio 11 adjuntado en el cuadernillo.'},
  {t:'Realiza caminatas al aire libre durante 20 minutos, manteniendo un ritmo cómodo, seguro y constante.', btn:true},
  {t:'Realiza 1 serie de 5 repeticiones del ejercicio 1 adjuntado en el cuadernillo.'},
  {t:'Realiza 1 serie de 10 repeticiones del ejercicio 2 adjuntado en el cuadernillo.'},
  {t:'Camina durante 25 minutos a paso ligero para activar tu cuerpo.'},
];
// Objetivos preseleccionados por backend (editables). Cada objetivo: área + perfil (si aplica) + mes activo
let objState={ obj:['Actividad Física','Nutrición','Mente activa'], perfil:['General','General',''], actTab:[0,0,0] };

// Un bloque por objetivo: selectores arriba y, si está relleno, sus actividades (tabs de mes + parrilla semanal)
function objetivoBlock(i){
  const area=objState.obj[i];
  const hp=hasPerfil(area);
  const filled = area && (!hp || objState.perfil[i]);
  const tab=objState.actTab[i]||0;
  return `<div class="objblock">
    <div class="objselrow">
      <div class="objfield">
        <label class="q">Área</label>
        <div class="selectbox"><select onchange="setObjArea(${i},this.value)"><option value="" ${area?'':'selected'} disabled>Selecciona...</option>${AREAS.map(x=>`<option ${x.a===area?'selected':''}>${x.a}</option>`).join('')}</select>${I.chevdown}</div>
      </div>
      ${(area&&hp)?`<div class="objfield">
        <label class="q">Perfil</label>
        <div class="selectbox"><select onchange="setPerfil(${i},this.value)"><option value="" ${objState.perfil[i]?'':'selected'} disabled>Selecciona un perfil...</option>${perfilOpts(area).map(p=>`<option ${p===objState.perfil[i]?'selected':''}>${p}</option>`).join('')}</select>${I.chevdown}</div>
      </div>`:''}
    </div>
    ${filled?`
      <div class="act-tabs month-tabs">${[0,1,2,3].map(m=>`<button class="act-tab ${m===tab?'on':''}" onclick="objState.actTab[${i}]=${m};openObjetivos()">Mes ${m+1}</button>`).join('')}</div>
      <div class="act-grid">
        <div class="act-grow act-ghead">${DIAS_SEM.map(d=>`<div class="act-hcell">${d}</div>`).join('')}</div>
        <div class="act-grow">${ACT_WEEK.map(a=>`<div class="act-cell"><p>${a.t}</p>${a.btn?`<button class="btn primary act-acceder">Acceder</button>`:''}</div>`).join('')}</div>
      </div>`:''}
  </div>`;
}

function openObjetivos(){
  useHeaderPortal();
  const allFilled = [0,1,2].every(i=>{ const a=objState.obj[i]; return a && (!hasPerfil(a) || objState.perfil[i]); });
  el('view').innerHTML=`
  <div class="page">
    <div class="subhead">
      <button class="back" onclick="goInforme()">${I.back}</button>
      <h1>Objetivos</h1>
    </div>
    <div class="objws">
      <aside class="areacol">
        ${AREAS.map(x=>`<div class="areacard ${x.lvl}">
          <div class="ac-head"><span class="ac-ic">${I[x.ic]}</span><span class="ac-name">${x.a}</span></div>
          <div class="ac-foot"><span class="ac-score">${x.s}/10</span><span class="ac-badge">${LVL_LABEL[x.lvl]}</span></div>
        </div>`).join('')}
      </aside>
      <div class="objright">
        <div class="objcard">
          <h4 class="objtitle">Objetivos</h4>
          ${[0,1,2].map(i=>objetivoBlock(i)).join('')}
        </div>
      </div>
    </div>
    <div class="subfoot">
      <button class="btn primary" ${allFilled?'':'disabled'} onclick="${allFilled?'saveObjetivos()':''}">Guardar y continuar</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}
function setObjArea(i,v){ objState.obj[i]=v; objState.perfil[i]=''; objState.actTab[i]=0; openObjetivos(); }
function setPerfil(i,v){ objState.perfil[i]=v; openObjetivos(); }
function saveObjetivos(){ state.done.objetivos=true; state.tActualizacion=new Date(); state.wizard=false; renderLanding(); }

/* ---------- Screen 5 : modal Generar informe ---------- */
function openModal(){
  const ov=document.createElement('div');
  ov.className='overlay open'; ov.id='overlay';
  ov.innerHTML=`
    <div class="modal">
      <div class="mh"><h3>Facturar informe</h3><button class="x" onclick="closeModal()">${I.x}</button></div>
      <p>El informe queda registrado una vez facturado. Es necesario indicar el método de envío del informe.</p>
      <div class="lbl">Método de envío</div>
      <label class="opt"><input type="radio" name="metodo" value="email"> Enviar por correo electrónico</label>
      <label class="opt"><input type="radio" name="metodo" value="ambos"> Enviar por correo electrónico y correo postal</label>
      <div class="mfoot">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="sendReport()">Facturar y enviar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
}
function closeModal(){ const o=el('overlay'); if(o) o.remove(); }

/* ---------- Modal: salir del informe (al volver al histórico) ---------- */
// Solo aplica a informes con status "pendiente de facturar"; el resto sale directo.
function confirmSalir(){
  const pendiente = state.done && state.done.analisis && state.done.resumen && state.done.objetivos && !state.generated;
  if(!pendiente){ goList(); return; }
  const ov=document.createElement('div');
  ov.className='overlay open'; ov.id='overlay';
  ov.onclick=(e)=>{ if(e.target===ov) closeModal(); };
  ov.innerHTML=`
    <div class="modal">
      <div class="mh"><h3>Salir del informe</h3><button class="x" onclick="closeModal()">${I.x}</button></div>
      ${alertHTML(true)}
      <p>Este informe no está facturado ni enviado al cliente. ¿Estás seguro que quieres salir del informe?</p>
      <div class="mfoot">
        <button class="btn" onclick="closeModal();goList()">Salir</button>
        <button class="btn primary" onclick="closeModal()">Volver al informe</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
}

/* ---------- Vista previa del informe (columna INFORME del histórico) ---------- */
function previewInforme(i){
  const r=CURRENT_ROWS[i];
  const ov=document.createElement('div');
  ov.className='overlay open'; ov.id='overlay';
  ov.onclick=(e)=>{ if(e.target===ov) closeModal(); };
  ov.innerHTML=`
    <div class="preview-modal">
      <div class="pm-head">
        <div><b>${r.informe}</b><span>${r.fecha} · ${r.metodo}</span></div>
        <button class="x" onclick="closeModal()">${I.x}</button>
      </div>
      <div class="pm-body">${coverHTML()}</div>
    </div>`;
  document.body.appendChild(ov);
}
function sendReport(){
  const sel=document.querySelector('input[name="metodo"]:checked');
  state.metodo = sel ? sel.value : 'email';
  state.generated=true;
  const now=new Date(); state.tGeneracion=now; state.tActualizacion=now;
  closeModal();
  renderLanding();
}

/* boot */
renderList();
</script>
